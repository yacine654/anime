<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess Who?</title>
<style>
:root{--bg:#000;--paper:#fff;--ink:#0b0514;--accent:#9333ea;--dim:#1a0b2e;--edge:#7e22ce}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:18px 4px 10px}
h1{margin:0;font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:30px;letter-spacing:-.01em}
.controls{display:flex;gap:8px}
button{font:inherit;font-weight:600;font-size:15px;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
button.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px var(--edge)}
button:focus-visible,.tile:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
details.pics{margin:0 0 10px;padding:4px 12px 10px;border-radius:14px;background:var(--dim)}
summary{cursor:pointer;font-weight:600;padding:8px 0;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--edge);font-size:14px}
.row input{color:var(--paper);font-size:12px;max-width:58%}
.hint{margin:6px 0 2px;font-size:13px;opacity:.6}
.secret{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--dim);margin-bottom:10px}
.peek{width:60px;height:60px;flex:none;border-radius:10px;overflow:hidden;background:#0e181d}
.peek svg,.peek img,.pic svg,.pic img{display:block;width:100%;height:100%}
.pic img{object-fit:cover}
.info{flex:1;min-width:0;font-size:13px;opacity:.85}
.info strong{display:block;font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:17px;opacity:1}
.info span{font-size:12px;opacity:.8}
.status{margin:0 4px 10px;font-size:14px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:28px}
@media (min-width:640px){.grid{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;cursor:pointer;perspective:800px;-webkit-tap-highlight-color:transparent;border-radius:14px}
.card{position:relative;aspect-ratio:4/5.5;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.1,.2,1)}
.tile.down .card{transform:rotateX(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:var(--paper);color:var(--ink);padding:7px 6px 8px;display:flex;flex-direction:column;gap:5px}
.pic{aspect-ratio:1;flex:none;border-radius:10px;overflow:hidden;background:#e9d5ff}
.name{height:2.3em;display:flex;align-items:center;justify-content:center;font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;font-weight:700;font-size:14px;line-height:1.15;text-align:center}
.series{height:2.5em;font-size:11px;line-height:1.25;text-align:center;opacity:.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.back{transform:rotateX(180deg);background:#14002b radial-gradient(#9333ea 1.2px,transparent 1.2px) 0 0/12px 12px;box-shadow:inset 0 0 0 1.5px var(--edge)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
[hidden]{display:none!important}
.seed{width:min(260px,80vw);padding:12px 18px;margin-bottom:6px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1.5px var(--edge);background:var(--dim);color:#fff;font:inherit;font-size:16px;text-align:center;outline:none}
.seed:focus-visible{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 3px rgba(147,51,234,.4)}
.seed::placeholder{color:#fff;opacity:.5}
.seedlabel{display:inline-block;margin-left:10px;font-size:13px;opacity:.6;letter-spacing:.04em}
#playBtn{min-width:240px;padding:18px 56px;font-size:20px;letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,#a855f7,#6d28d9);box-shadow:0 0 0 2px #000,0 0 0 4px #9333ea,0 12px 32px rgba(147,51,234,.55);transition:transform .2s,box-shadow .2s}
#playBtn:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #000,0 0 0 4px #c084fc,0 16px 40px rgba(147,51,234,.7)}
#playBtn:active{transform:translateY(1px)}
@media (prefers-reduced-motion:reduce){#playBtn{transition:none}}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.screen button{min-width:200px}
.title{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:clamp(56px,16vw,96px);font-weight:700;line-height:1;margin:0 0 36px;letter-spacing:.02em;color:#fff;text-align:center;text-shadow:0 0 28px rgba(147,51,234,.7),0 3px 0 #4c1d95}
.title::after{content:"";display:block;width:72px;height:4px;margin:20px auto 0;background:#9333ea;border-radius:2px;box-shadow:0 0 14px #9333ea}
.screen h2{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:26px;margin:0 0 8px}
.loadtext{margin:0;font-size:16px;opacity:.8;text-align:center}
.bar{width:min(320px,80vw);height:10px;border-radius:999px;background:var(--dim);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <section id="home" class="screen">
    <h1 class="title">Guess Who?</h1>
    <input id="seedInput" class="seed" placeholder="Seed (optional)" maxlength="20" autocomplete="off" autocapitalize="off">
    <button id="playBtn">Play</button>
  </section>

  <section id="loading" class="screen" hidden>
    <p class="loadtext">Loading characters</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </section>

  <div id="game" hidden>
  <header>
    <div><h1>Guess Who?</h1><span class="seedlabel" id="seedLabel"></span></div>
    <div class="controls">
      <button class="ghost" id="menuBtn">Menu</button>
      <button class="ghost" id="resetBtn">Flip all up</button>
    </div>
  </header>

  <main class="grid" id="grid"></main>
  </div>
</div>

<script>
const CAST_BASE = [

const RAW = [
  ["Alisa Mikhailovna Kujou (Alya)","Alya Sometimes Hides Her Feelings in Russian"],

  ["Sakura Haruno","Naruto"]

const EXTRA = RAW.map(([name, series]) => ({ name, series, first: name, q: name.replace(/\s*\(.*\)$/, "") }));
const CAST = CAST_BASE.map(c => ({ q: c.name, ...c })).concat(EXTRA);

const SKIN = ["#f6d2b1","#e8b48a","#c68a5b","#8d5a3b","#5a3a28"];
const HAIR = ["short","long","bun","bald","curly"];
const HAIR_COLORS = ["#2b1b12","#7a4a22","#d9a441","#b5472e","#3a3a3a","#e9e4dc"];
const HAT_COLORS = ["#c0392b","#2e86ab","#f4a261","#6a4c93","#3d405b"];
const BGS = ["#f9c74f","#90be6d","#f9844a","#8ecae6","#cdb4db","#ffd6d6"];
const SHIRTS = ["#264653","#2a9d8f","#e76f51","#6d597a","#457b9d"];

const $ = s => document.querySelector(s);
const grid = $("#grid");
const pick = a => a[Math.floor(Math.random() * a.length)];
let rnd = Math.random;
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let order = [], down = new Set(), faces = {}, imgs = {}, apiImgs = {}, secret = null;

function randomFace() {
  return {
    skin: pick(SKIN), hair: pick(HAIR), hairColor: pick(HAIR_COLORS),
    eyes: pick(["dot","round"]), mouth: pick(["smile","grin"]),
    glasses: Math.random() < .3, beard: Math.random() < .25,
    hat: Math.random() < .2, hatColor: pick(HAT_COLORS),
    earring: Math.random() < .25, bg: pick(BGS), shirt: pick(SHIRTS)
  };
}

function makeFaces() {
  const seen = new Set(), out = {};
  CAST.forEach(c => {
    let f, key;
    do {
      f = randomFace();
      key = JSON.stringify(Object.values(f));
    } while (seen.has(key));
    seen.add(key);
    out[c.first] = f;
  });
  return out;
}

function svg(p) {
  const h = p.hairColor, k = p.skin;
  let s = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
  s += `<rect width="100" height="100" fill="${p.bg}"/>`;
  s += `<path d="M16 100Q16 78 50 76Q84 78 84 100Z" fill="${p.shirt}"/>`;
  if (p.hair === "long") s += `<rect x="22" y="34" width="56" height="50" rx="26" fill="${h}"/>`;
  s += `<ellipse cx="24" cy="54" rx="4" ry="6" fill="${k}"/><ellipse cx="76" cy="54" rx="4" ry="6" fill="${k}"/>`;
  if (p.earring) s += `<circle cx="24" cy="63" r="2.2" fill="#f4c542"/><circle cx="76" cy="63" r="2.2" fill="#f4c542"/>`;
  s += `<ellipse cx="50" cy="50" rx="25" ry="29" fill="${k}"/>`;
  if (p.hair === "short" || p.hair === "long") s += `<path d="M24 46Q20 18 50 18Q80 18 76 46Q70 31 50 33Q32 31 24 46Z" fill="${h}"/>`;
  if (p.hair === "bun") s += `<circle cx="50" cy="15" r="9" fill="${h}"/><path d="M24 46Q20 22 50 21Q80 22 76 46Q70 31 50 33Q32 31 24 46Z" fill="${h}"/>`;
  if (p.hair === "curly") s += [24,36,50,64,76].map((x, i) => `<circle cx="${x}" cy="${i % 2 ? 24 : 30}" r="9" fill="${h}"/>`).join("") + `<path d="M24 44Q24 30 50 31Q76 30 76 44Q70 32 50 34Q30 32 24 44Z" fill="${h}"/>`;
  if (p.hat) s += `<path d="M23 40Q23 13 50 13Q77 13 77 40Z" fill="${p.hatColor}"/><rect x="21" y="33" width="58" height="6" rx="3" fill="#000" fill-opacity=".2"/>`;
  s += `<path d="M35 43Q40 40.5 45 43M55 43Q60 40.5 65 43" stroke="${h}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const eye = x => p.eyes === "round"
    ? `<circle cx="${x}" cy="52" r="4" fill="#fff"/><circle cx="${x}" cy="52" r="2.2" fill="#1c1c1c"/>`
    : `<circle cx="${x}" cy="52" r="2.4" fill="#1c1c1c"/>`;
  s += eye(40) + eye(60);
  s += `<path d="M50 54L48.5 59.5H51.5" stroke="#000" stroke-opacity=".3" stroke-width="1.6" fill="none" stroke-linejoin="round"/>`;
  if (p.beard) s += `<path d="M26 56Q27 84 50 85Q73 84 74 56Q70 68 50 69Q30 68 26 56Z" fill="${h}"/>`;
  s += p.mouth === "grin"
    ? `<path d="M40 65Q50 76 60 65Z" fill="#6b1e1e"/>`
    : `<path d="M42 67Q50 72 58 67" stroke="#6b1e1e" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  if (p.glasses) s += `<g fill="#fff" fill-opacity=".15" stroke="#1c1c1c" stroke-width="2"><circle cx="40" cy="51" r="7.5"/><circle cx="60" cy="51" r="7.5"/></g><path d="M47.5 51H52.5" stroke="#1c1c1c" stroke-width="2"/>`;
  return s + `</svg>`;
}

function picHTML(c) {
  const src = imgs[c.first] || apiImgs[c.first];
  return src ? `<img src="${src}" alt="">` : "";
}

function updateStatus() {}

function render() {
  grid.innerHTML = order.map(c => {
    const d = down.has(c.first);
    return `<div class="tile${d ? " down" : ""}" role="button" tabindex="0" aria-pressed="${d}" aria-label="${c.name}" data-k="${c.first}">` +
      `<div class="card">` +
        `<div class="face front"><div class="pic">${picHTML(c)}</div><div class="name">${c.name}</div><div class="series">${c.series}</div></div>` +
        `<div class="face back"></div>` +
      `</div></div>`;
  }).join("");
  updateStatus();
}

function refreshPeek() {}

function newGame() {
  faces = makeFaces();
  order = shuffle([...CAST]).slice(0, 18);
  down.clear();
  secret = pick(order);
  render();
}

function toggle(t) {
  const k = t.dataset.k;
  const d = !down.has(k);
  d ? down.add(k) : down.delete(k);
  t.classList.toggle("down", d);
  t.setAttribute("aria-pressed", d);
  updateStatus();
}

grid.addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (t) toggle(t);
});

grid.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("tile")) {
    e.preventDefault();
    toggle(e.target);
  }
});


$("#resetBtn").addEventListener("click", () => {
  down.clear();
  grid.querySelectorAll(".tile.down").forEach(t => { t.classList.remove("down"); t.setAttribute("aria-pressed", "false"); });
  updateStatus();
});


newGame();

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function lookupPic(name) {
  try {
    const r = await fetch(`https://api.jikan.moe/v4/characters?q=${encodeURIComponent(name)}&limit=1`);
    if (r.ok) {
      const j = await r.json();
      const u = j.data?.[0]?.images?.jpg?.image_url;
      if (u) return u;
    }
  } catch (e) {}
  try {
    const r = await fetch("https://graphql.anilist.co", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query: "query($s:String){Character(search:$s){image{large}}}", variables: { s: name } })
    });
    if (r.ok) {
      const j = await r.json();
      return j.data?.Character?.image?.large || null;
    }
  } catch (e) {}
  return null;
}

async function loadApiPics() {
  statusEl.textContent = "Looking up pictures...";
  for (const c of CAST) {
    if (imgs[c.first] || apiImgs[c.first]) continue;
    const u = await lookupPic(c.name);
    if (u) apiImgs[c.first] = u;
    render();
    refreshPeek();
    await sleep(400);
  }
}

const getJSON = async (url, opts) => {
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(url, opts);
      if (r.status === 429) { await sleep(1500 * (i + 1)); continue; }
      return r.ok ? await r.json() : null;
    } catch (e) {
      await sleep(800);
    }
  }
  return null;
};

async function findPic(name) {
  const al = await getJSON("https://graphql.anilist.co", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      query: "query($s:String){Page(perPage:5){characters(search:$s){image{large}}}}",
      variables: { s: name }
    })
  });
  const alPic = al?.data?.Page?.characters?.map(c => c.image?.large).find(Boolean);
  if (alPic) return alPic;

  const jk = await getJSON(`https://api.jikan.moe/v4/characters?q=${encodeURIComponent(name)}&limit=5`);
  return jk?.data?.map(c => c.images?.jpg?.image_url).find(Boolean) || null;
}

async function findByMedia(c) {
  const d = await getJSON("https://graphql.anilist.co", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      query: "query($s:String){Media(search:$s,type:ANIME){characters(perPage:50,sort:[ROLE,RELEVANCE]){nodes{name{full} image{large}}}}}",
      variables: { s: c.series }
    })
  });
  const nodes = d?.data?.Media?.characters?.nodes || [];
  const want = c.name.toLowerCase();
  const hit = nodes.find(n => n.name.full?.toLowerCase() === want)
           || nodes.find(n => n.name.full?.toLowerCase().includes(c.first));
  return hit?.image?.large || null;
}

const seriesCache = {};
function fetchSeries(series) {
  if (!seriesCache[series]) {
    seriesCache[series] = getJSON("https://graphql.anilist.co", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        query: "query($s:String){Media(search:$s,type:ANIME){characters(perPage:50,sort:[ROLE,RELEVANCE]){nodes{name{full} image{large}}}}}",
        variables: { s: series }
      })
    }).then(d => d?.data?.Media?.characters?.nodes || []);
  }
  return seriesCache[series];
}

async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: n }, async () => {
    while (i < items.length) await fn(items[i++]);
  }));
}

async function loadPics() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("gw-pics") || "{}"); } catch (e) {}
  Object.assign(apiImgs, saved);
  render();

  const todo = order.filter(c => !apiImgs[c.first]);
  const seriesList = [...new Set(todo.map(c => c.series).filter(Boolean))];
  const nodes = {};
  await pool(seriesList, 3, async s => { nodes[s] = await fetchSeries(s); });

  const found = {};
  todo.forEach(c => {
    const want = c.q.toLowerCase();
    const list = nodes[c.series] || [];
    const hit = list.find(n => n.name.full?.toLowerCase() === want)
             || list.find(n => n.name.full?.toLowerCase().includes(c.q.split(" ")[0].toLowerCase()));
    if (hit?.image?.large) found[c.first] = hit.image.large;
  });

  const missing = todo.filter(c => !found[c.first]);
  await pool(missing, 3, async c => {
    const u = await findPic(c.q);
    if (u) found[c.first] = u;
  });

  Object.assign(apiImgs, found);
  try { localStorage.setItem("gw-pics", JSON.stringify(apiImgs)); } catch (e) {}
  render();
  refreshPeek();
}

function show(id) {
  ["home", "loading", "game"].forEach(s => { $("#" + s).hidden = s !== id; });
}

function play() {
  const typed = $("#seedInput").value.trim().toLowerCase();
  const seed = typed || Math.random().toString(36).slice(2, 8);
  rnd = mulberry32(hashStr(seed));
  show("loading");
  newGame();
  rnd = Math.random;
  $("#seedLabel").textContent = `Seed: ${seed}`;
  const ms = 3000 + Math.random() * 2000;
  const fill = $("#fill");
  fill.style.transition = "none";
  fill.style.width = "0";
  void fill.offsetWidth;
  fill.style.transition = `width ${ms}ms linear`;
  fill.style.width = "100%";
  const bar = new Promise(r => setTimeout(r, ms));
  const pics = loadPics();
  Promise.all([bar, pics]).then(() => show("game"));
}

$("#playBtn").addEventListener("click", play);
$("#menuBtn").addEventListener("click", () => show("home"));

show("home");
</script>
